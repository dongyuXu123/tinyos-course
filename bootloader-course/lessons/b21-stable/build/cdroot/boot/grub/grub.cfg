# Lesson B21: framebuffer 交接 —— 启动 TinyOS L61 GUI 内核
# 与 TinyOS 主线的 grub.cfg 对齐：gfxmode/gfxpayload=800x600x32。
# 本 loader 不解析 gfxmode 环境变量，而是读内核 header 的 graphics request
# tag（800x600x32）并设置 VBE（GRUB 同款行为）。
set timeout=0
echo "B21 script: booting TinyOS L61 GUI kernel"
multiboot2 /boot/kernel.elf
echo "B21 script: kernel loaded, framebuffer handoff"
boot
