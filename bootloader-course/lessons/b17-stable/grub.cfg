# Lesson B17: grub.cfg 解析执行 —— 配置即脚本
# loader 启动时自动读取 /boot/grub/grub.cfg 并逐行执行：
#   set / echo / badcmd（错误继续）/ menuentry（识别跳过）/ multiboot2 / boot
set timeout=0
set root=(cd0)
echo "B17 script: grub.cfg executing"
echo "root is $root"
badcmd this line errors but does not stop the script
menuentry "Test Kernel" {
    echo "menuentry body not executed in B17"
}
multiboot2 /boot/kernel.elf
echo "B17 script: kernel loaded, booting"
boot
