# Lesson B22: 故障调试演示
# 错误路径（GRUB 脚本语义：error 打印后继续执行）：
#   1. 坏 ELF（/boot/bad.elf，magic 被破坏）-> error: invalid ELF header
#   2. 坏 header（/boot/badheader.elf，mb2 checksum 被破坏）-> error: invalid multiboot2 header
#   3. 缺文件（/boot/missing.elf）-> error: file not found
#   4. 缺模块（/boot/missing.mod）-> error: file not found (insmod)
# 随后正常装载 /boot/kernel.elf 并启动——错误不阻断脚本（GRUB 语义）。
set timeout=0
multiboot2 /boot/bad.elf
multiboot2 /boot/badheader.elf
multiboot2 /boot/missing.elf
insmod /boot/missing.mod
echo "B22 script: errors handled, continuing"
multiboot2 /boot/kernel.elf
echo "B22 script: kernel loaded, booting"
boot
