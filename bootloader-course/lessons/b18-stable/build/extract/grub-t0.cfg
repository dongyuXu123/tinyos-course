# Lesson B18: timeout=0 变体——不显示菜单，立即启动 default
# （对齐 TinyOS 主线 grub.cfg 的 timeout=0/default=0 行为）
set timeout=0
set default=0
set root=(cd0)
echo "B18 script: grub.cfg loaded"
menuentry "Mini-GRUB Test Kernel (default)" {
    multiboot2 /boot/kernel.elf
    boot
}
menuentry "Second entry (echo only)" {
    echo "B18: second entry selected"
}
